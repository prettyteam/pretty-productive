<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f6f0"><meta name="robots" content="noindex">
<title>Your RX · Taffeta Salon &amp; Spa</title>
<link rel="icon" href="../icon.png"><link rel="apple-touch-icon" href="../icon.png">
<link rel="stylesheet" href="../g/base.css">
<style>
/* The guest's RX card: white page with a thin cream border, like the Home Maintenance PDF. Everything comes from the link after #. */
html,body{background:var(--card)}
main{padding:14px 12px 40px}
.page{background:#fff;border:10px solid var(--card);outline:1px solid var(--line);padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px}
.top img{width:70px}
.rxh{display:flex;align-items:center;gap:14px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 0}
.rxh .rx{font-family:var(--display);font-size:52px;line-height:.85}
.rxh p{font-size:12.5px;line-height:1.4;text-wrap:balance}
.for{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--soft)}
.talk{font-size:15px}
/* both options in one card: "Option 1 ... $total"; tap an option for the breakdown (Alexandra, Oct 15 2026) */
.rxo{border:1px solid var(--line);padding:4px 16px;display:flex;flex-direction:column}
.rxo>.eyebrow{color:var(--brown);padding:10px 0 2px}
.rxo details+details{border-top:1px solid var(--line)}
.rxo summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;font-size:17px;font-variant-numeric:tabular-nums}
.rxo summary::-webkit-details-marker{display:none}
.rxo summary .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.rxo summary .nm::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--soft);border-bottom:1.5px solid var(--soft);transform:rotate(-45deg);transition:transform .15s}
.rxo details[open] summary .nm::before{transform:rotate(45deg)}
.rxo summary b{font-size:18px}
.rxo .brk{display:flex;flex-direction:column;gap:6px;padding:0 0 12px 15px}
.rxo .brk .badge{align-self:flex-start;margin-top:2px}
.li{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}
.li small{display:block;color:var(--soft);font-size:12.5px}
.tot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:6px;font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-weight:400;font-size:12.5px;border:1px solid currentColor;border-radius:999px;padding:1px 9px}
.badge.ok{color:#2f6b3f}.badge.over{color:#9a4a2b}
.maint{background:var(--ivory);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.maint .eyebrow{color:var(--brown)}
.sign{font-family:var(--pep);font-style:italic;font-weight:500;font-size:24px;text-align:center;color:var(--brown)}
.foot{font-size:12.5px;color:var(--soft);text-align:center;border-top:1px solid var(--line);padding-top:10px}
.foot a{color:inherit}
.bad{text-align:center;padding:60px 10px}
/* matches the team app (Alexandra, Oct 15 2026): app ivory, white page in a double black frame, square corners */
:root{--ivory:#f8f6f0;--card:#f8f6f0;--brown:#121212;--ink:#121212;--soft:#5f5b55;--line:#e2ded5;--gold:#121212}
html,body{background:#f8f6f0}
.page{border:1px solid #2b2a28;outline:1px solid #2b2a28;outline-offset:-7px;padding:30px 24px 24px}
.rxo{border-color:#2b2a28}
.maint{background:#f8f6f0}
.rxo .flat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.rxo .flat b{font-size:18px}
.rxo details+.flat{border-top:1px solid var(--line)}
.sign{display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:21px;color:var(--ink)}
.sign .namepic{height:38px;width:auto;max-width:130px;filter:brightness(0);margin:-6px 0}
.when{font-size:13px;color:var(--soft);text-align:center;margin:-10px 0 0}
.talked{text-align:center}
.talked summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:underline;text-underline-offset:5px;padding:4px 0}
.talked summary::-webkit-details-marker{display:none}
.addl summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.addl summary::-webkit-details-marker{display:none}
.addl summary .eyebrow{margin:0}
.addl .pm::before{content:"+";font-size:20px;line-height:1}
.addl[open] .pm::before{content:"\2212"}
.addl[open] summary{margin-bottom:8px}
.talked summary::after{content:"";width:6px;height:6px;border-right:1.2px solid var(--ink);border-bottom:1.2px solid var(--ink);transform:rotate(45deg);margin-top:-3px;transition:transform .15s}
.talked[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.talked .tbody{display:flex;flex-direction:column;gap:10px;padding:12px 4px 0;text-align:left}
.tline{margin:0;font-size:15px;line-height:1.45}
.tline b{display:block;font-size:11px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
@media print{.talked .tbody{display:flex}}
.rxo summary .nmt{display:flex;flex-direction:column;gap:2px;font-weight:400}
.rxo summary .nmt em{font-family:var(--display);font-style:italic;font-size:22px;line-height:1.15;font-weight:500}
.rxo summary .nmt small{font-size:13px;line-height:1.35;color:var(--soft)}
.rxo summary .nm:has(.nmt){align-items:flex-start}
.rxo summary .nm:has(.nmt)::before{margin-top:10px;flex:none}
.for .dt{font-size:12.5px;letter-spacing:.06em;color:var(--soft);font-variant-numeric:tabular-nums}
</style>
</head><body>
<main id="app"></main>
<script>
(async function(){
  const app=document.getElementById('app');
  const el=(t,a,...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a||{}))if(v!=null)x==='class'?e.className=v:e.setAttribute(x,v);for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));return e};
  const money=n=>'$'+(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
  let c=null;
  try{
  const raw=location.hash.slice(1), z=raw[0]==='z', bin=Uint8Array.from(atob((z?raw.slice(1):raw).replace(/-/g,'+').replace(/_/g,'/')),ch=>ch.charCodeAt(0));
  if(z) c=JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
  else c=JSON.parse(new TextDecoder().decode(bin));
  }catch(e){c=null}
  /* cards made before Oct 17 2026 carried VIP in "v" (0 = not VIP), so v 0 or 1 both open; VIP now lives in "vp" */
  if(!c||(c.v!==1&&c.v!==0)||!Array.isArray(c.o)){
    /* a Go back button on this page (Alexandra, Oct 17 2026); with nothing to go back to, it opens taffetadesign.com */
    const back=el('button',{class:'btn',type:'button',style:'max-width:260px;margin:22px auto 0'},'Go back');
    back.onclick=()=>{if(history.length>1)history.back();else location.href='https://taffetadesign.com'};
    app.append(el('div',{class:'bad'},el('h1',{},'This card didn’t open'),el('p',{},'Ask your Taffeta artist to show the QR again.'),back));return}
  /* tell the front desk she opened her card, so they don't need to text it (not when the artist or desk previews it) */
  if(c.s&&c.i&&!/[?&]p=1/.test(location.search)){try{if(!localStorage.getItem('rx-open:'+c.i)){localStorage.setItem('rx-open:'+c.i,'1');
    fetch('https://script.google.com/macros/s/AKfycbx9ZpBSWFRlPCrRrLzJWd_AgjuoQnqKUdSDZWDu-7CkaknkcJxic_bo_DWsIzOinG90eg/exec',{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'rxopen',s:c.s,i:c.i})}).catch(()=>{})}}catch(e){}}
  const vip='vp' in c?c.vp===1:c.v===1;
  const skin=c.k==='skin', date=new Date((c.d||'')+'T12:00');
  document.title=(c.g?c.g+'’s ':'Your ')+'RX · Taffeta Salon & Spa';
  // one card: each option shows just its name and total; tapping it opens the breakdown that adds up to that total
  /* two options: the higher one is "All In", the other "Worth The Wait", each with a short line (Alexandra, Oct 15 2026) */
  const tots=(c.o||[]).map(([,lines])=>lines.reduce((s,l)=>s+l[1],0)), hi=tots.length===2&&tots[0]!==tots[1]?tots.indexOf(Math.max(...tots)):-1;
  /* skin: how long the results last (the difference is the home care, not spelled out here) (Alexandra, Oct 20 2026) */
  const NAMES=c.k==='skin'?[['All In','Your goal achieved, with results lasting about 4 to 6 weeks.'],['Worth The Wait','A big step toward your goals, with results lasting about 2 weeks.']]
    :[['All In','Your inspo goal achieved in this visit.'],['Worth The Wait','You’ll leave feeling happy & fresh, with a big step toward your goals.']];
  const opts=(c.o||[]).length?el('section',{class:'rxo'},el('span',{class:'eyebrow'},'Your options for today'),(c.o||[]).map(([title,lines],i)=>{const t=tots[i];
    const nm=hi<0?null:NAMES[i===hi?0:1];
    return el('details',{},el('summary',{},nm?el('span',{class:'nm'},el('span',{class:'nmt'},el('em',{},nm[0]),el('small',{},nm[1]))):el('span',{class:'nm'},title),el('b',{},money(t))),
      el('div',{class:'brk'},lines.map(([n,p,r])=>el('div',{class:'li'},el('span',{},n),el('span',{},r?el('s',{style:'opacity:.55;margin-right:6px'},money(r)):null,money(p)))),
        c.b?el('span',{class:'badge '+(t<=c.b?'ok':'over')},t<=c.b?'Within your budget':money(t-c.b)+' over your budget'):null));
  })):null;
  const m=c.m||[[],'',''], mt=m[0].reduce((s,l)=>s+l[1],0);
  /* the next visit in plain words: "Color and haircut or style" (Alexandra, Oct 15 2026), not a list */
  function nextWhat(){
    if(skin) return /every .*weeks/i.test(m[2]||'')?'':(m[2]||'');   /* services are listed above and the timing is in "In about": no repeats (Alexandra, Oct 20 2026) */
    const names=m[0].map(([n])=>n).join(' ').toLowerCase();
    const color=/balayage|foil|highlight|single process|glaze|shadow root|lightener|color|gloss/.test(names);
    const cut=/haircut|cut|blow ?dry|style|leave wet|blowdry/.test(names);
    return color&&cut?'Color and haircut or style':color?'Color':cut?'Haircut or style':(m[2]||'');
  }
  /* goals, "right now" and budget: no box, one "What We Talked About" link at the bottom of the page that opens them,
     so the only box is the options (Alexandra, Oct 15 2026) */
  const line=(label,body)=>el('p',{class:'tline'},el('b',{},label),body);
  const aboutLines=[c.w?line('Your Goals For Today',c.w):null,c.n&&c.n.length?line('Right Now',c.n.join(', ').replace(/^./,x=>x.toUpperCase())):null,
    c.b?line('Your Budget Today',money(c.b)):null].filter(Boolean);
  const about=aboutLines.length?el('details',{class:'talked'},el('summary',{},skin?'Skin Goals':'Hair Goals'),el('div',{class:'tbody'},aboutLines)):null;
  /* sign-off like the Home Maintenance PDFs: "Pretty Hair by [name in Antoinetta] xo"; the date sits under it */
  /* brows or lashes only: Pretty Brows / Pretty Lashes instead of Pretty Skin (Alexandra, Oct 20 2026) */
  function rxPretty(c){const sv=(c.o||[]).flatMap(([,L])=>L.map(l=>l[0])).filter(n=>n!=='Maintenance'),b=sv.some(n=>/^Brow/.test(n)),l=sv.some(n=>/Lash/.test(n));
    return sv.length&&sv.every(n=>/^Brow|Lash/.test(n))?(b&&l?'Pretty Brows & Lashes by ':b?'Pretty Brows by ':'Pretty Lashes by '):'Pretty Skin by '}
  const first=String(c.a||'').trim().split(/\s+/)[0]||'', pre=!skin?'Pretty Hair by ':rxPretty(c);
  const sign=el('p',{class:'sign'},pre,first?el('img',{class:'namepic',src:'../g/names/'+first.toLowerCase()+'.png',alt:first}):'Taffeta',' xo');
  const pic=sign.querySelector('img');if(pic)pic.onerror=()=>pic.replaceWith(document.createTextNode(first));
  /* artist or desk preview (?p=1): a Go back button to get back to editing; guests never see it (Alexandra, Oct 20 2026) */
  const prev=/[?&]p=1/.test(location.search);
  const goBack=prev?el('button',{type:'button',style:'display:block;margin:0 auto 18px;padding:11px 22px;border:1px solid #121212;border-radius:999px;background:#fff;color:#121212;font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer'},'‹ Go Back To Edit'):null;
  if(goBack)goBack.onclick=()=>{if(history.length>1){history.back();return}try{window.close()}catch(e){}setTimeout(()=>{location.href=document.referrer||'https://prettyteam.taffetadesign.com/cards/'},300)};
  app.append(el('div',{class:'page'},
    goBack,
    el('div',{class:'top'},el('img',{src:'../g/logo.png',alt:'Taffeta Salon & Spa'})),
    el('div',{class:'rxh'},el('span',{class:'rx'},'Rx'),el('p',{},'Personal plan from today’s consultation and what your next visit looks like.')),
    /* date small at the top as 10/15/26 (Alexandra, Oct 15 2026) */
    el('div',{class:'for'},el('span',{},'For '+(c.g||'you'),vip?el('span',{style:'margin-left:8px;font-size:11px;letter-spacing:.16em;border:1px solid currentColor;border-radius:999px;padding:1px 8px;vertical-align:middle'},'VIP'):null),isNaN(date)?null:el('span',{class:'dt'},(date.getMonth()+1)+'/'+date.getDate()+'/'+String(date.getFullYear()).slice(-2))),
    opts,
    /* All In stops at a $400 ticket; anything more is her call (Alexandra, Oct 16 2026) */
    /* closed by default: "Additional suggestions +" opens it (Alexandra, Oct 20 2026) */
    (c.f&&c.f.length)?el('details',{class:'maint addl'},el('summary',{},el('span',{class:'eyebrow'},'Additional suggestions'),el('span',{class:'pm','aria-hidden':'true'})),
      el('p',{style:'font-size:14px;margin:0'},c.hs?'Add your P50 to All In. It’s the step that makes your results last, and it isn’t in the totals above.':(c.k==='skin'?'':'Start with a Try Me today. ')+'These are the full sizes we’d love you to take home. They aren’t in the totals above.'),
      c.f.map(([n,p])=>el('div',{class:'tot',style:'border-top:0;padding-top:0;font-size:14px'},el('span',{},n),el('span',{},money(p))))):
    c.x?el('p',{class:'talk',style:'text-align:center;font-size:14px'},'Want home care or a treatment added? Just ask, and we’ll add it to your plan.'):null,
    el('section',{class:'maint'},el('span',{class:'eyebrow'},'Your next visit'),
      /* no receipt-style breakdown here: what the visit looks like and about what it costs (Alexandra, Oct 15 2026) */
      /* each service with its price, the way artists write it on the paper card (Alexandra, Oct 17 2026) */
      m[0].length?el('div',{class:'brk',style:'padding:0'},m[0].map(([n,p,r])=>el('div',{class:'li'},el('span',{},n),el('span',{},r?el('s',{style:'opacity:.55;margin-right:6px'},money(r)):null,money(p))))):null,
      /* skin with two options: Worth The Wait comes back in 4 weeks, All In in 4–6 weeks (its home care keeps results longer) (Alexandra, Oct 20 2026) */
      el('div',{class:'tot'},el('span',{},c.k==='skin'&&hi>=0?'Your next visit':m[1]?'In about '+m[1]:'Your next visit'),el('span',{},money(mt))),
      c.k==='skin'&&hi>=0?el('div',{class:'brk',style:'padding:6px 0 0'},el('div',{class:'li'},el('span',{},'With Worth The Wait'),el('span',{},'in about 4 weeks')),el('div',{class:'li'},el('span',{},'With All In'),el('span',{},'in about 4–6 weeks'))):null,
      nextWhat()?el('p',{style:'font-size:14px;margin:0'},nextWhat()):null),

    sign,
    about,
    el('p',{class:'foot'},'Prices are estimates and can change with time and product used. ',el('br'),'Book your next visit: ',el('a',{href:'tel:+16093835504'},'(609) 383-5504'),' · ',el('a',{href:'https://taffetadesign.com'},'taffetadesign.com'))));
})();
</script>
